name: CI/CD Pipeline

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  quality-check:
    name: Lint & Build Gate
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Type Check & Build
        run: npm run build

  deploy:
    name: Deploy to Docker
    needs: quality-check
    runs-on: self-hosted
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Deploy Local Docker Container
        run: |
          cd /home/ubuntu/projects/personal/lvn-movie
          git fetch origin master
          git reset --hard origin/master
          docker compose up -d --build --force-recreate
          docker image prune -f
